name: Build and deploy the archive

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The nightly forum sweep asks for a deploy itself; its own push cannot.
  workflow_call:
    inputs:
      ref:
        description: >-
          What to build. A run started by a schedule is pinned to the commit
          it began at, which is the one before the sweep pushed, so the sweep
          names what it wrote. Empty means the commit that started the run.
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/configure-pages@v6
        id: pages
        with:
          enablement: true
      - name: Build the site
        run: python3 build.py --out _site --base-url "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
